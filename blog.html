<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>المدونة | Minsaj DZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ====== CSS ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0a0a;
            color: #f0ece6;
            line-height: 1.8;
            min-height: 100vh;
            transition: 0.3s;
        }

        /* ====== وضع فاتح ====== */
        body.light-mode {
            background: #f5f5f5;
            color: #1a1a1a;
        }
        body.light-mode .bg-card {
            background: #ffffff;
        }
        body.light-mode .border {
            border-color: #e0e0e0;
        }
        body.light-mode .text-muted {
            color: #666;
        }

        /* ====== إصلاح المقالات في الوضع الفاتح ====== */
        body.light-mode .post {
            background: #ffffff;
            border-color: #e0e0e0;
        }
        body.light-mode .post .post-title {
            color: #1a1a1a;
        }
        body.light-mode .post .post-title a {
            color: #1a1a1a;
        }
        body.light-mode .post .post-title a:hover {
            color: var(--accent);
        }
        body.light-mode .post .post-excerpt {
            color: #444;
        }
        body.light-mode .post .post-meta {
            color: #888;
        }
        body.light-mode .post .read-more {
            color: var(--accent);
            border-color: rgba(108, 139, 158, 0.2);
        }
        body.light-mode .post .read-more:hover {
            background: var(--accent);
            color: #fff;
        }

        /* ====== إصلاح شريط البحث في الوضع الفاتح ====== */
        body.light-mode .search-bar {
            background: #ffffff;
        }
        body.light-mode .search-bar input {
            color: #1a1a1a;
            background: #f5f5f5;
        }

        /* ====== إصلاح التصنيفات في الوضع الفاتح ====== */
        body.light-mode .tags-filter {
            background: #ffffff;
        }
        body.light-mode .tags-filter .tag-item {
            background: rgba(108, 139, 158, 0.08);
            color: var(--accent);
        }
        body.light-mode .tags-filter .tag-item:hover {
            background: rgba(108, 139, 158, 0.15);
        }
        body.light-mode .tags-filter .tag-item.active {
            background: var(--accent);
            color: #fff;
        }

        /* ====== إصلاح شريط التحديث ====== */
        body.light-mode .refresh-bar {
            background: #ffffff;
        }
        body.light-mode .btn-refresh {
            background: rgba(108, 139, 158, 0.08);
            color: var(--accent);
        }
        body.light-mode .btn-refresh:hover {
            background: var(--accent);
            color: #fff;
        }

        /* ====== إصلاح الترقيم ====== */
        body.light-mode .pagination button {
            background: #ffffff;
            border-color: #e0e0e0;
            color: #666;
        }
        body.light-mode .pagination button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        body.light-mode .pagination button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        :root {
            --accent: #6c8b9e;
            --accent-light: #8aadc2;
            --accent-dark: #4a6a7e;
            --bg-card: #1a1a1a;
            --border: rgba(108, 139, 158, 0.08);
            --text-muted: #6a625a;
            --text-secondary: #b8b0a8;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
        }

        header {
            padding: 14px 0;
            background: rgba(10, 10, 10, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        body.light-mode header {
            background: rgba(255, 255, 255, 0.96);
            border-color: #e0e0e0;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 900;
            color: #f0ece6;
        }
        body.light-mode .logo {
            color: #1a1a1a;
        }
        .logo span {
            color: var(--accent);
        }
        .logo .sub {
            font-size: 0.4rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            display: block;
            font-weight: 400;
        }

        .btn-home {
            display: inline-block;
            background: rgba(108, 139, 158, 0.08);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            border: 1px solid rgba(108, 139, 158, 0.12);
            transition: 0.3s;
        }
        .btn-home:hover {
            background: var(--accent);
            color: #0a0a0a;
            transform: translateY(-2px);
        }
        body.light-mode .btn-home:hover {
            color: #fff;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
            font-family: inherit;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        body.light-mode .theme-toggle {
            background: rgba(0, 0, 0, 0.05);
            border-color: #e0e0e0;
        }

        .hero {
            padding: 30px 0 15px;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f0ece6;
        }
        body.light-mode .hero h1 {
            color: #1a1a1a;
        }
        .hero h1 span {
            color: var(--accent);
        }
        .hero .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ====== البحث ====== */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        body.light-mode .search-bar {
            background: #ffffff;
        }
        .search-bar input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #f0ece6;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.3s;
        }
        body.light-mode .search-bar input {
            color: #1a1a1a;
            background: #f5f5f5;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .search-bar .btn-search {
            background: var(--accent);
            color: #0a0a0a;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }
        .search-bar .btn-search:hover {
            transform: scale(1.02);
        }

        /* ====== تصفية بالوسوم (مدمجة في شريط صغير) ====== */
        .tags-filter {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            margin-bottom: 20px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        body.light-mode .tags-filter {
            background: #ffffff;
        }
        .tags-filter .tags-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-weight: 700;
            margin-left: 6px;
        }
        .tags-filter .tag-item {
            background: rgba(108, 139, 158, 0.08);
            color: var(--accent);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .tags-filter .tag-item:hover {
            background: rgba(108, 139, 158, 0.15);
        }
        body.light-mode .tags-filter .tag-item:hover {
            background: rgba(108, 139, 158, 0.15);
        }
        .tags-filter .tag-item.active {
            background: var(--accent);
            color: #0a0a0a;
            border-color: var(--accent);
        }
        body.light-mode .tags-filter .tag-item.active {
            background: var(--accent);
            color: #fff;
        }
        .tags-filter .tag-item.clear-tag {
            background: rgba(239, 68, 68, 0.08);
            color: var(--danger);
            font-size: 0.65rem;
        }
        .tags-filter .tag-item.clear-tag:hover {
            background: rgba(239, 68, 68, 0.15);
        }
        .tags-filter .tag-item .tag-count {
            font-size: 0.55rem;
            opacity: 0.5;
            margin-right: 2px;
        }

        /* ====== شريط التحكم ====== */
        .refresh-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        body.light-mode .refresh-bar {
            background: #ffffff;
        }
        .refresh-bar .info {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .refresh-bar .info i {
            color: var(--accent);
        }
        .refresh-bar .info .page-info {
            color: var(--accent);
            font-weight: 700;
        }
        .btn-refresh {
            background: rgba(108, 139, 158, 0.1);
            color: var(--accent);
            border: 1px solid rgba(108, 139, 158, 0.15);
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .btn-refresh:hover {
            background: var(--accent);
            color: #0a0a0a;
        }
        body.light-mode .btn-refresh:hover {
            color: #fff;
        }

        /* ====== المقالات ====== */
        .post {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 22px 24px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            transition: 0.3s;
            animation: fadeUp 0.4s ease;
        }
        .post:hover {
            border-color: rgba(108, 139, 158, 0.15);
        }
        .post .post-image {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .post .post-title {
            font-size: 1.3rem;
            font-weight: 900;
            color: #f0ece6;
            margin-bottom: 4px;
            line-height: 1.4;
        }
        body.light-mode .post .post-title {
            color: #1a1a1a;
        }
        .post .post-title a {
            color: #f0ece6;
        }
        body.light-mode .post .post-title a {
            color: #1a1a1a;
        }
        .post .post-title a:hover {
            color: var(--accent);
        }
        .post .post-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        body.light-mode .post .post-meta {
            color: #888;
        }
        .post .post-meta i {
            color: var(--accent);
            margin: 0 3px;
        }
        .post .post-excerpt {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.8;
        }
        body.light-mode .post .post-excerpt {
            color: #444;
        }
        .post .read-more {
            display: inline-block;
            margin-top: 12px;
            color: var(--accent);
            font-weight: 700;
            border: 1px solid rgba(108, 139, 158, 0.12);
            padding: 5px 18px;
            border-radius: 30px;
            transition: 0.3s;
            font-size: 0.8rem;
        }
        .post .read-more:hover {
            background: var(--accent);
            color: #0a0a0a;
        }
        body.light-mode .post .read-more:hover {
            color: #fff;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-indicator {
            text-align: center;
            padding: 30px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .loading-indicator i {
            color: var(--accent);
            margin-left: 8px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding: 15px 0;
        }
        .pagination button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: 0.3s;
            font-family: inherit;
        }
        .pagination button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .pagination button.active {
            background: var(--accent);
            color: #0a0a0a;
            border-color: var(--accent);
        }
        body.light-mode .pagination button.active {
            color: #fff;
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        body.light-mode .pagination button {
            background: #ffffff;
            border-color: #e0e0e0;
            color: #666;
        }
        body.light-mode .pagination button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .status-message {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .status-message i {
            font-size: 2.2rem;
            color: var(--accent);
            margin-bottom: 12px;
        }
        .status-message .sub-msg {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 8px;
        }
        .status-message .btn-retry {
            background: var(--accent);
            color: #0a0a0a;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            font-family: inherit;
            transition: 0.3s;
        }
        .status-message .btn-retry:hover {
            transform: scale(1.05);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 12px;
            color: #f0ece6;
            font-weight: 700;
            z-index: 9999;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            text-align: center;
            font-size: 0.9rem;
        }
        body.light-mode .toast {
            color: #1a1a1a;
            background: #ffffff;
            border-color: #e0e0e0;
        }
        .toast.show {
            display: block;
            animation: fadeUp 0.3s ease;
        }
        .toast.success {
            border-color: var(--success);
        }
        .toast.error {
            border-color: var(--danger);
        }
        .toast.info {
            border-color: var(--accent);
        }

        footer {
            padding: 25px 0;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            margin-top: 15px;
        }
        body.light-mode footer {
            border-color: #e0e0e0;
        }
        footer .ornament {
            font-size: 0.6rem;
            color: var(--accent-dark);
            letter-spacing: 10px;
            opacity: 0.2;
        }
        footer p {
            font-size: 0.75rem;
        }

        @media (max-width: 600px) {
            .post {
                padding: 16px 18px;
            }
            .post .post-title {
                font-size: 1.1rem;
            }
            .hero h1 {
                font-size: 1.8rem;
            }
            .refresh-bar,
            .search-bar {
                flex-direction: column;
                text-align: center;
            }
            .tags-filter {
                flex-wrap: wrap;
                justify-content: center;
            }
            .pagination button {
                padding: 4px 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="logo">Minsaj <span>DZ</span><span class="sub">✦ مدونة البرمجيات والتقنية ✦</span></div>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <button class="theme-toggle" onclick="toggleTheme()">
                    <i class="fas fa-moon"></i> <span id="theme-label">وضع داكن</span>
                </button>
                <a href="https://seislemzhf.github.io" class="btn-home"><i class="fas fa-arrow-right"></i> الرئيسية</a>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1><span>مدونة</span> Minsaj DZ</h1>
            <p class="subtitle">برمجيات، تقنية، وتجارب <i class="fas fa-code" style="color: var(--accent);"></i></p>
        </div>
    </section>

    <section>
        <div class="container">

            <!-- بحث -->
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="🔍 ابحث في المقالات..." oninput="handleSearch()">
                <button class="btn-search" onclick="handleSearch()"><i class="fas fa-search"></i> بحث</button>
            </div>

            <!-- تصفية بالوسوم (مصغرة) -->
            <div class="tags-filter" id="tagsFilter">
                <span class="tags-label"><i class="fas fa-tags"></i></span>
                <span class="tag-item clear-tag" onclick="filterByTag(null)">🗑️ الكل</span>
            </div>

            <!-- شريط التحكم -->
            <div class="refresh-bar">
                <span class="info">
                    <i class="fas fa-database"></i>
                    <span id="post-count">0</span> مقال
                    <span style="margin:0 10px;">|</span>
                    <i class="fas fa-layer-group"></i>
                    <span id="page-info" class="page-info">الصفحة 1</span>
                </span>
                <button class="btn-refresh" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> تحديث</button>
            </div>

            <!-- حاوية المقالات -->
            <div id="posts-container">
                <div class="status-message"><i class="fas fa-spinner fa-spin"></i><p>جاري تحميل المقالات...</p></div>
            </div>

            <!-- مؤشر التحميل -->
            <div class="loading-indicator" id="loadingIndicator" style="display:none;">
                <i class="fas fa-spinner fa-spin"></i> جاري تحميل المزيد...
            </div>

            <!-- ترقيم الصفحات -->
            <div class="pagination" id="pagination"></div>

        </div>
    </section>

    <footer>
        <div class="container">
            <div class="ornament">✦ ✦ ✦</div>
            <p>🇩🇿 صنع في الجزائر بـ ❤️</p>
            <p>© 2026 <strong>Minsaj DZ</strong> – جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        // =========================================================
        // 📝 المدونة مع Infinite Scroll + Pagination + Tags
        // =========================================================

        const USERNAME = 'seislemzhf';
        const REPO = 'seislemzhf.github.io';
        const PATH = 'data/posts.json';
        const RAW_URL = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/${PATH}`;
        const POSTS_PER_PAGE = 8;

        let allPosts = [];
        let filteredPosts = [];
        let currentPage = 1;
        let isLoading = false;
        let hasMore = true;
        let currentTag = null;
        let searchQuery = '';

        // ====== دوال مساعدة ======
        function stripHtml(html) {
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        function formatDate(dateStr) {
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch { return dateStr; }
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 4000);
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const label = document.getElementById('theme-label');
            if (document.body.classList.contains('light-mode')) {
                label.textContent = 'وضع فاتح';
                localStorage.setItem('theme', 'light');
            } else {
                label.textContent = 'وضع داكن';
                localStorage.setItem('theme', 'dark');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('theme-label').textContent = 'وضع فاتح';
            }
            loadPosts();
        });

        // ====== تحميل المقالات ======
        async function loadPosts() {
            const container = document.getElementById('posts-container');
            if (!container) return;

            container.innerHTML =
            `<div class="status-message"><i class="fas fa-spinner fa-spin"></i><p>جاري تحميل المقالات...</p></div>`;

            try {
                const response = await fetch(RAW_URL + '?t=' + Date.now());

                if (response.status === 404) {
                    container.innerHTML =
                        `<div class="status-message"><i class="fas fa-newspaper" style="color:var(--accent);"></i><p>لا توجد مقالات حالياً.</p><p class="sub-msg">ترقبوا المقالات القادمة قريباً!</p></div>`;
                    return;
                }

                if (!response.ok) throw new Error('فشل في تحميل المقالات');

                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('بيانات غير صالحة');

                allPosts = data.filter(function(p) {
                    return p.published !== false && p.status !== 'draft' && !p.deleted;
                });

                extractTags();
                applyFilters();

            } catch (error) {
                console.error('خطأ:', error);
                container.innerHTML =
                    `
                    <div class="status-message">
                        <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>
                        <p>حدث خطأ في تحميل المقالات</p>
                        <p class="sub-msg">${error.message}</p>
                        <button class="btn-retry" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> إعادة المحاولة</button>
                    </div>
                `;
            }
        }

        // ====== استخراج الوسوم ======
        function extractTags() {
            const tagsMap = {};
            allPosts.forEach(function(post) {
                if (post.tags) {
                    post.tags.split(',').forEach(function(t) {
                        const tag = t.trim();
                        if (tag) {
                            tagsMap[tag] = (tagsMap[tag] || 0) + 1;
                        }
                    });
                }
            });

            const tagsFilter = document.getElementById('tagsFilter');
            if (!tagsFilter) return;

            // الاحتفاظ بـ "الكل"
            let html = `<span class="tags-label"><i class="fas fa-tags"></i></span>`;
            html += `<span class="tag-item clear-tag" onclick="filterByTag(null)">🗑️ الكل</span>`;

            // ترتيب الوسوم حسب الأكثر استخداماً
            const sortedTags = Object.keys(tagsMap).sort(function(a, b) {
                return tagsMap[b] - tagsMap[a];
            });

            sortedTags.forEach(function(tag) {
                const count = tagsMap[tag];
                const active = currentTag === tag ? 'active' : '';
                html +=
                    `<span class="tag-item ${active}" onclick="filterByTag('${tag}')">#${tag} <span class="tag-count">${count}</span></span>`;
            });

            tagsFilter.innerHTML = html;
        }

        // ====== الفلترة ======
        function applyFilters() {
            filteredPosts = allPosts.filter(function(post) {
                if (currentTag) {
                    const tags = (post.tags || '').split(',').map(function(t) { return t.trim(); });
                    if (!tags.includes(currentTag)) return false;
                }
                if (searchQuery) {
                    const query = searchQuery.toLowerCase();
                    const title = (post.title || '').toLowerCase();
                    const content = stripHtml(post.content || '').toLowerCase();
                    const tags = (post.tags || '').toLowerCase();
                    if (!title.includes(query) && !content.includes(query) && !tags.includes(query)) return false;
                }
                return true;
            });

            currentPage = 1;
            hasMore = true;
            renderPage();
        }

        // ====== البحث ======
        function handleSearch() {
            const input = document.getElementById('search-input');
            if (!input) return;
            searchQuery = input.value.trim();
            applyFilters();
        }

        // ====== فلترة بالوسم ======
        function filterByTag(tag) {
            currentTag = tag;
            // تحديث حالة الأزرار
            document.querySelectorAll('.tags-filter .tag-item').forEach(function(el) {
                el.classList.remove('active');
                if (el.textContent.trim().startsWith('#' + tag)) {
                    el.classList.add('active');
                }
            });
            applyFilters();
            // تمرير للأعلى
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ====== عرض الصفحة ======
        function renderPage() {
            const container = document.getElementById('posts-container');
            const countEl = document.getElementById('post-count');
            const pageInfoEl = document.getElementById('page-info');
            const paginationEl = document.getElementById('pagination');
            const loadingIndicator = document.getElementById('loadingIndicator');

            if (!container) return;

            if (filteredPosts.length === 0) {
                container.innerHTML =
                    `
                    <div class="status-message">
                        <i class="fas fa-search" style="color:var(--accent);"></i>
                        <p>لا توجد مقالات تطابق بحثك</p>
                        <p class="sub-msg">جرب كلمات بحث مختلفة أو أزل التصفية</p>
                    </div>
                `;
                if (countEl) countEl.textContent = '0';
                if (paginationEl) paginationEl.innerHTML = '';
                return;
            }

            if (countEl) countEl.textContent = filteredPosts.length;

            const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
            const start = (currentPage - 1) * POSTS_PER_PAGE;
            const end = Math.min(start + POSTS_PER_PAGE, filteredPosts.length);
            const pagePosts = filteredPosts.slice(start, end);

            if (pageInfoEl) pageInfoEl.textContent = `الصفحة ${currentPage} من ${totalPages}`;

            let html = '';
            pagePosts.forEach(function(post) {
                const title = post.title || 'بدون عنوان';
                const date = post.date || new Date().toISOString();
                const tags = post.tags || 'عام';
                const fullText = stripHtml(post.content || '');
                const excerpt = fullText.length > 250 ? fullText.substring(0, 250) + '...' : fullText;

                let imageHtml = '';
                if (post.image) {
                    imageHtml =
                    `<img src="${post.image}" alt="${title}" class="post-image" loading="lazy" onerror="this.style.display='none'">`;
                }

                html += `
                    <div class="post">
                        ${imageHtml}
                        <h2 class="post-title">
                            <a href="view-post.html?id=${post.id}">${title}</a>
                        </h2>
                        <div class="post-meta">
                            <i class="fas fa-calendar"></i> ${formatDate(date)}
                            <span style="margin:0 6px;">|</span>
                            <i class="fas fa-tag"></i> ${tags}
                            ${post.image ? `<span style="margin:0 6px;">|</span> <i class="fas fa-image"></i>` : ''}
                        </div>
                        <div class="post-excerpt">${excerpt}</div>
                        <a href="view-post.html?id=${post.id}" class="read-more">اقرأ المزيد <i class="fas fa-arrow-left"></i></a>
                    </div>
                `;
            });

            container.innerHTML = html;
            renderPagination(totalPages);

            hasMore = currentPage < totalPages;
            if (!hasMore) {
                if (loadingIndicator) loadingIndicator.style.display = 'none';
            }
        }

        // ====== عرض أزرار الترقيم ======
        function renderPagination(totalPages) {
            const paginationEl = document.getElementById('pagination');
            if (!paginationEl) return;

            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
                return;
            }

            let html = '';
            html +=
                `<button onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>
                <i class="fas fa-chevron-right"></i>
            </button>`;

            let startPage = Math.max(1, currentPage - 3);
            let endPage = Math.min(totalPages, currentPage + 3);

            if (startPage > 1) {
                html += `<button onclick="goToPage(1)">1</button>`;
                if (startPage > 2) html += `<button disabled>...</button>`;
            }

            for (let i = startPage; i <= endPage; i++) {
                if (i === currentPage) {
                    html += `<button class="active">${i}</button>`;
                } else {
                    html += `<button onclick="goToPage(${i})">${i}</button>`;
                }
            }

            if (endPage < totalPages) {
                if (endPage < totalPages - 1) html += `<button disabled>...</button>`;
                html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
            }

            html +=
                `<button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>
                <i class="fas fa-chevron-left"></i>
            </button>`;

            paginationEl.innerHTML = html;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ====== Infinite Scroll ======
        function handleScroll() {
            const loadingIndicator = document.getElementById('loadingIndicator');
            if (!loadingIndicator) return;

            const scrollTop = window.scrollY;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;

            if (scrollTop + windowHeight >= documentHeight * 0.8) {
                if (!isLoading && hasMore) {
                    loadMore();
                }
            }
        }

        function loadMore() {
            const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
            if (currentPage >= totalPages) {
                hasMore = false;
                return;
            }

            isLoading = true;
            const loadingIndicator = document.getElementById('loadingIndicator');
            if (loadingIndicator) loadingIndicator.style.display = 'block';

            setTimeout(function() {
                currentPage++;
                renderPage();
                isLoading = false;
                if (loadingIndicator) loadingIndicator.style.display = 'none';
            }, 500);
        }

        window.addEventListener('scroll', handleScroll);

        window.handleSearch = handleSearch;
        window.filterByTag = filterByTag;
        window.goToPage = goToPage;
        window.loadPosts = loadPosts;
        window.toggleTheme = toggleTheme;

        console.log('📝 Blog Loaded with Tags Filter');
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المدونة | Minsaj DZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0a0a;
            color: #f0ece6;
            line-height: 1.8;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }
        a { text-decoration: none; color: inherit; }

        :root {
            --accent: #6c8b9e;
            --accent-light: #8aadc2;
            --accent-dark: #4a6a7e;
            --bg-card: #1a1a1a;
            --border: rgba(108, 139, 158, 0.08);
            --text-muted: #6a625a;
            --text-secondary: #b8b0a8;
        }

        /* ====== Header ====== */
        header {
            padding: 20px 0;
            background: rgba(10, 10, 10, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: #f0ece6;
        }
        .logo span { color: var(--accent); }
        .logo .sub {
            font-size: 0.5rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            display: block;
            font-weight: 400;
        }
        .btn-home {
            display: inline-block;
            background: rgba(108, 139, 158, 0.08);
            color: var(--accent);
            padding: 8px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(108, 139, 158, 0.12);
            transition: 0.3s;
        }
        .btn-home:hover {
            background: var(--accent);
            color: #0a0a0a;
            transform: translateY(-2px);
        }

        /* ====== Hero ====== */
        .hero {
            padding: 40px 0 20px;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: #f0ece6;
        }
        .hero h1 span { color: var(--accent); }
        .hero .subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* ====== المقالات ====== */
        .post {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 30px 35px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        .post:hover {
            border-color: rgba(108, 139, 158, 0.15);
        }
        .post .post-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: #f0ece6;
            margin-bottom: 5px;
        }
        .post .post-title a { color: #f0ece6; }
        .post .post-title a:hover { color: var(--accent); }
        .post .post-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        .post .post-meta i { color: var(--accent); margin: 0 4px; }
        .post .post-excerpt {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.9;
        }
        .post .read-more {
            display: inline-block;
            margin-top: 15px;
            color: var(--accent);
            font-weight: 700;
            border: 1px solid rgba(108, 139, 158, 0.12);
            padding: 6px 20px;
            border-radius: 30px;
            transition: 0.3s;
            font-size: 0.85rem;
        }
        .post .read-more:hover {
            background: var(--accent);
            color: #0a0a0a;
        }

        /* ====== حالة عدم وجود مقالات ====== */
        .status-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .status-message i { font-size: 2.5rem; color: var(--accent); margin-bottom: 15px; }
        .status-message .sub-msg { font-size: 0.85rem; opacity: 0.6; margin-top: 10px; }

        /* ====== Footer ====== */
        footer {
            padding: 30px 0;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            margin-top: 20px;
        }
        footer .ornament {
            font-size: 0.7rem;
            color: var(--accent-dark);
            letter-spacing: 10px;
            opacity: 0.2;
        }

        @media (max-width: 700px) {
            .post { padding: 20px; }
            .post .post-title { font-size: 1.3rem; }
            .hero h1 { font-size: 2rem; }
            .header-content { justify-content: center; }
        }
    </style>
</head>
<body>

    <!-- ====== Header ====== -->
    <header>
        <div class="container header-content">
            <div class="logo">
                Minsaj <span>DZ</span>
                <span class="sub">✦ مدونة البرمجيات والتقنية ✦</span>
            </div>
            <a href="https://seislemzhf.github.io" class="btn-home">
                <i class="fas fa-arrow-right"></i> الرئيسية
            </a>
        </div>
    </header>

    <!-- ====== Hero ====== -->
    <section class="hero">
        <div class="container">
            <h1><span>مدونة</span> Minsaj DZ</h1>
            <p class="subtitle">برمجيات، تقنية، وتجارب <i class="fas fa-code" style="color: var(--accent);"></i></p>
        </div>
    </section>

    <!-- ====== المحتوى ====== -->
    <section>
        <div class="container">
            <div id="posts-container">
                <div class="status-message" id="loading-status">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>جاري تحميل المقالات...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- ====== Footer ====== -->
    <footer>
        <div class="container">
            <div class="ornament">✦ ✦ ✦</div>
            <p>🇩🇿 صنع في الجزائر بـ ❤️</p>
            <p>© 2026 <strong>Minsaj DZ</strong> – جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script>
        // =========================================================
        // 📝 جلب المقالات من LocalStorage وعرضها (للقراء فقط)
        // =========================================================
        (function() {
            const container = document.getElementById('posts-container');
            const STORAGE_KEY = 'blog_posts';

            function formatDate(dateStr) {
                try {
                    const d = new Date(dateStr);
                    return d.toLocaleDateString('ar-EG', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                } catch {
                    return dateStr;
                }
            }

            // استخراج نص عادي من HTML (للمقتطف)
            function stripHtml(html) {
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || '';
            }

            function renderPosts(posts) {
                // عرض المقالات المنشورة فقط
                const publishedPosts = posts.filter(post => post.published !== false);

                if (!publishedPosts || publishedPosts.length === 0) {
                    container.innerHTML = `
                        <div class="status-message">
                            <i class="fas fa-newspaper" style="color:var(--accent);"></i>
                            <p>لا توجد مقالات منشورة حالياً.</p>
                            <p class="sub-msg">ترقبوا المقالات القادمة قريباً!</p>
                        </div>
                    `;
                    return;
                }

                // ترتيب من الأحدث إلى الأقدم
                const sorted = [...publishedPosts].sort((a, b) => new Date(b.date) - new Date(a.date));

                let html = '';
                sorted.forEach((post) => {
                    const title = post.title || 'بدون عنوان';
                    const date = post.date || new Date().toISOString();
                    const tags = post.tags || 'عام';
                    // مقتطف من المحتوى (أول 200 حرف بدون HTML)
                    const fullText = stripHtml(post.content || 'لا يوجد محتوى.');
                    const excerpt = fullText.length > 200 ? fullText.substring(0, 200) + '...' : fullText;

                    html += `
                        <div class="post">
                            <h2 class="post-title">
                                <a href="view-post.html?id=${post.id}">${title}</a>
                            </h2>
                            <div class="post-meta">
                                <i class="fas fa-calendar"></i> ${formatDate(date)}
                                <span style="margin:0 8px;">|</span>
                                <i class="fas fa-tag"></i> ${tags}
                            </div>
                            <div class="post-excerpt">
                                ${excerpt}
                            </div>
                            <a href="view-post.html?id=${post.id}" class="read-more">
                                اقرأ المزيد <i class="fas fa-arrow-left"></i>
                            </a>
                        </div>
                    `;
                });

                container.innerHTML = html;
            }

            function loadPosts() {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const posts = JSON.parse(saved);
                        renderPosts(posts);
                    } catch (e) {
                        container.innerHTML = `
                            <div class="status-message">
                                <i class="fas fa-exclamation-circle" style="color:#EF4444;"></i>
                                <p>حدث خطأ في قراءة المقالات.</p>
                                <p class="sub-msg">يرجى المحاولة مرة أخرى لاحقاً.</p>
                            </div>
                        `;
                        console.error('خطأ في قراءة المقالات:', e);
                    }
                } else {
                    container.innerHTML = `
                        <div class="status-message">
                            <i class="fas fa-newspaper" style="color:var(--accent);"></i>
                            <p>لا توجد مقالات حالياً.</p>
                            <p class="sub-msg">ترقبوا المقالات القادمة قريباً!</p>
                        </div>
                    `;
                }
            }

            // تحميل المقالات فوراً
            loadPosts();

            // الاستماع للتغييرات في LocalStorage (من dashboard)
            window.addEventListener('storage', function(e) {
                if (e.key === STORAGE_KEY) {
                    loadPosts();
                }
            });

            // إعادة التحميل كل 10 ثوانٍ للتحديث التلقائي (في حال تغيير المقالات من dashboard)
            setInterval(loadPosts, 10000);
        })();
    </script>

</body>
</html>

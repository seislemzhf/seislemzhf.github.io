<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>توليد Sitemap</title>
</head>
<body>
    <h1>توليد Sitemap.xml تلقائياً</h1>
    <button onclick="generateSitemap()">توليد Sitemap</button>
    <pre id="output"></pre>

    <script>
        const USERNAME = 'seislemzhf';
        const REPO = 'seislemzhf.github.io';
        const PATH = 'data/posts.json';
        const RAW_URL = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/${PATH}`;
        const BASE_URL = 'https://seislemzhf.github.io/';

        async function generateSitemap() {
            const output = document.getElementById('output');

            try {
                const response = await fetch(RAW_URL);
                const posts = await response.json();

                let xml = `<?xml version="1.0" encoding="UTF-8"?>
        <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
                <loc>${BASE_URL}</loc>
                <changefreq>weekly</changefreq>
                <priority>1.0</priority>
            </url>
            <url>
                <loc>${BASE_URL}blog.html</loc>
                <changefreq>daily</changefreq>
                <priority>0.9</priority>
            </url>`;

                if (Array.isArray(posts)) {
                    posts.forEach(post => {
                        const date = post.date ? post.date.split('T')[0] : new Date().toISOString().split('T')[0];
                        xml += `
                            <url>
                                <loc>${BASE_URL}view-post.html?id=${post.id}</loc>
                                <lastmod>${date}</lastmod>
                                <changefreq>monthly</changefreq>
                                <priority>0.8</priority>
                            </url>`;
                    });
                }

                xml += `
        </urlset>`;

                output.textContent = xml;

                // تحميل الملف
                const blob = new Blob([xml], { type: 'text/xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'sitemap.xml';
                a.click();
                URL.revokeObjectURL(url);

            } catch (error) {
                output.textContent = 'خطأ: ' + error.message;
            }
        }
    </script>
</body>
</html>

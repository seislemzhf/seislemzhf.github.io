<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>عرض المقال | Minsaj DZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0a0a;
            color: #f0ece6;
            line-height: 1.8;
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 0 16px; }
        a { text-decoration: none; color: inherit; }

        :root {
            --accent: #6c8b9e;
            --accent-light: #8aadc2;
            --accent-dark: #4a6a7e;
            --bg-card: #1a1a1a;
            --border: rgba(108, 139, 158, 0.08);
            --text-muted: #6a625a;
            --text-secondary: #b8b0a8;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
        }

        /* ====== Header ====== */
        header {
            padding: 14px 0;
            background: rgba(10, 10, 10, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo { font-size: 1.3rem; font-weight: 900; color: #f0ece6; }
        .logo span { color: var(--accent); }
        .logo .sub { font-size: 0.4rem; color: var(--text-muted); letter-spacing: 4px; display: block; font-weight: 400; }
        .btn-back {
            display: inline-block;
            background: rgba(108, 139, 158, 0.08);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            border: 1px solid rgba(108, 139, 158, 0.12);
            transition: 0.3s;
        }
        .btn-back:hover { background: var(--accent); color: #0a0a0a; transform: translateY(-2px); }

        /* ====== المحتوى ====== */
        #post-container {
            padding: 20px 0 30px;
        }

        .post-full {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 35px 40px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }
        .post-full .post-title {
            font-size: 2rem;
            font-weight: 900;
            color: #f0ece6;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .post-full .post-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .post-full .post-meta i { color: var(--accent); margin: 0 4px; }
        .post-full .post-body {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 2;
        }
        .post-full .post-body img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid var(--border);
        }
        .post-full .post-body iframe {
            max-width: 100%;
            border-radius: 10px;
            margin: 20px 0;
        }
        .post-full .post-body h1, .post-full .post-body h2, .post-full .post-body h3 {
            color: #f0ece6;
            margin: 20px 0 10px;
        }
        .post-full .post-body ul, .post-full .post-body ol {
            padding-right: 25px;
            margin: 10px 0;
        }
        .post-full .post-body blockquote {
            border-right: 3px solid var(--accent);
            padding: 10px 20px;
            margin: 15px 0;
            background: rgba(108, 139, 158, 0.04);
            border-radius: 0 8px 8px 0;
            color: var(--accent-light);
        }
        .post-full .post-body pre {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow-x: auto;
            direction: ltr;
            text-align: left;
            font-family: monospace;
            color: #f0ece6;
            margin: 15px 0;
        }

        /* ====== أزرار المشاركة ====== */
        .share-section {
            margin: 25px 0 30px;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .share-section .share-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }
        .share-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            color: white;
        }
        .share-btn:hover { transform: scale(1.05); }
        .share-btn.whatsapp { background: #25D366; }
        .share-btn.facebook { background: #1877F2; }
        .share-btn.twitter { background: #000000; }
        .share-btn.telegram { background: #0088cc; }
        .share-btn.copy { background: var(--accent); color: #0a0a0a; }
        .share-btn.copy:hover { background: var(--accent-light); }
        .share-btn i { font-size: 1rem; }

        /* ====== التعليقات ====== */
        .comments-section {
            margin-top: 30px;
        }
        .comments-section h3 {
            font-size: 1.3rem;
            font-weight: 900;
            color: #f0ece6;
            margin-bottom: 18px;
        }
        .comments-section h3 span { color: var(--accent); }
        .comments-section h3 .count {
            background: var(--accent);
            color: #0a0a0a;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            margin-right: 8px;
        }

        .comment-form {
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }
        .comment-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .comment-form input,
        .comment-form textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #f0ece6;
            font-size: 0.9rem;
            font-family: inherit;
            transition: 0.3s;
        }
        .comment-form input:focus,
        .comment-form textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .comment-form textarea {
            min-height: 80px;
            resize: vertical;
        }
        .comment-form .btn-submit {
            background: var(--accent);
            color: #0a0a0a;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            margin-top: 10px;
        }
        .comment-form .btn-submit:hover { transform: scale(1.02); }
        .comment-form .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .comment {
            background: rgba(255,255,255,0.02);
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .comment .comment-author {
            font-weight: 800;
            color: var(--accent-light);
            font-size: 0.95rem;
        }
        .comment .comment-date {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-right: 10px;
        }
        .comment .comment-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .no-comments {
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }

        /* ====== حالة التحميل ====== */
        .status-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .status-message i { font-size: 2.5rem; color: var(--accent); margin-bottom: 15px; }
        .status-message .sub-msg { font-size: 0.85rem; opacity: 0.6; margin-top: 8px; }
        .status-message .btn-retry {
            background: var(--accent);
            color: #0a0a0a;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            font-family: inherit;
            transition: 0.3s;
        }
        .status-message .btn-retry:hover { transform: scale(1.05); }

        /* ====== Toast ====== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 12px;
            color: #f0ece6;
            font-weight: 700;
            z-index: 9999;
            display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            max-width: 90%;
            text-align: center;
            font-size: 0.9rem;
        }
        .toast.show { display: block; animation: fadeUp 0.3s ease; }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.info { border-color: var(--accent); }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ====== Footer ====== */
        footer {
            padding: 25px 0;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            margin-top: 15px;
        }
        footer .ornament { font-size: 0.6rem; color: var(--accent-dark); letter-spacing: 10px; opacity: 0.2; }
        footer p { font-size: 0.75rem; }

        @media (max-width: 700px) {
            .post-full { padding: 18px 16px; }
            .post-full .post-title { font-size: 1.5rem; }
            .comment-form .form-row { grid-template-columns: 1fr; }
            .share-buttons { justify-content: center; }
            .share-btn { padding: 6px 14px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="logo">Minsaj <span>DZ</span><span class="sub">✦ مدونة البرمجيات والتقنية ✦</span></div>
            <a href="blog.html" class="btn-back"><i class="fas fa-arrow-right"></i> العودة للمدونة</a>
        </div>
    </header>

    <section>
        <div class="container">
            <div id="post-container">
                <div class="status-message">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>جاري تحميل المقال...</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="ornament">✦ ✦ ✦</div>
            <p>🇩🇿 صنع في الجزائر بـ ❤️</p>
            <p>© 2026 <strong>Minsaj DZ</strong> – جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        // =========================================================
        // 📖 عرض المقالة كاملة مع تعليقات وروابط مشاركة
        // =========================================================

        // ====== المسار ======
        const USERNAME = 'seislemzhf';
        const REPO = 'seislemzhf.github.io';
        const PATH = 'data/posts.json';
        const RAW_URL = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/${PATH}`;

        // ====== متغيرات عامة ======
        let currentPostId = null;
        let currentPost = null;

        // ====== دوال مساعدة ======
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        function getPostIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function formatDate(dateStr) {
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch {
                return dateStr;
            }
        }

        function getCurrentURL() {
            return window.location.href;
        }

        function getPostTitle() {
            return currentPost ? currentPost.title : 'مشاركة';
        }

        // ====== التعليقات ======
        function getComments(postId) {
            const key = 'blog_comments_' + postId;
            try {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : [];
            } catch {
                return [];
            }
        }

        function saveComments(postId, comments) {
            const key = 'blog_comments_' + postId;
            localStorage.setItem(key, JSON.stringify(comments));
        }

        function addComment(postId, name, text) {
            const comments = getComments(postId);
            comments.push({
                id: 'c_' + Date.now(),
                name: name || 'زائر',
                text: text.trim(),
                date: new Date().toISOString()
            });
            saveComments(postId, comments);
            return comments;
        }

        // ====== عرض المقال ======
        async function loadPost() {
            const container = document.getElementById('post-container');
            const postId = getPostIdFromURL();

            if (!postId) {
                container.innerHTML = `
                    <div class="status-message">
                        <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>
                        <p>لم يتم تحديد المقال</p>
                        <p class="sub-msg">الرجاء العودة إلى المدونة واختيار مقال.</p>
                        <a href="blog.html" class="btn-retry"><i class="fas fa-arrow-right"></i> العودة للمدونة</a>
                    </div>
                `;
                return;
            }

            currentPostId = postId;

            try {
                const response = await fetch(RAW_URL + '?t=' + Date.now());

                if (response.status === 404) {
                    container.innerHTML = `
                        <div class="status-message">
                            <i class="fas fa-newspaper" style="color:var(--accent);"></i>
                            <p>لا توجد مقالات حالياً.</p>
                            <p class="sub-msg">ترقبوا المقالات القادمة!</p>
                            <a href="blog.html" class="btn-retry"><i class="fas fa-arrow-right"></i> العودة للمدونة</a>
                        </div>
                    `;
                    return;
                }

                if (!response.ok) throw new Error('فشل في تحميل المقال');

                const allPosts = await response.json();
                if (!Array.isArray(allPosts)) throw new Error('بيانات غير صالحة');

                const post = allPosts.find(p => p.id === postId);
                if (!post) {
                    container.innerHTML = `
                        <div class="status-message">
                            <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>
                            <p>المقال غير موجود</p>
                            <p class="sub-msg">قد يكون تم حذفه أو لم ينشر بعد.</p>
                            <a href="blog.html" class="btn-retry"><i class="fas fa-arrow-right"></i> العودة للمدونة</a>
                        </div>
                    `;
                    return;
                }

                currentPost = post;

                // جلب التعليقات
                const comments = getComments(postId);
                const commentsCount = comments.length;

                // بناء HTML
                const date = formatDate(post.date);
                const tags = post.tags || 'عام';
                const content = post.content || 'لا يوجد محتوى.';
                const title = post.title || 'بدون عنوان';
                const url = getCurrentURL();

                let html = `
                    <div class="post-full">
                        <h1 class="post-title">${title}</h1>
                        <div class="post-meta">
                            <i class="fas fa-calendar"></i> ${date}
                            <span style="margin:0 10px;">|</span>
                            <i class="fas fa-tag"></i> ${tags}
                        </div>
                        <div class="post-body">
                            ${content}
                        </div>

                        <!-- ====== أزرار المشاركة ====== -->
                        <div class="share-section">
                            <div class="share-label"><i class="fas fa-share-alt"></i> شارك هذا المقال:</div>
                            <div class="share-buttons">
                                <button class="share-btn whatsapp" onclick="shareOn('whatsapp')">
                                    <i class="fab fa-whatsapp"></i> واتساب
                                </button>
                                <button class="share-btn facebook" onclick="shareOn('facebook')">
                                    <i class="fab fa-facebook-f"></i> فيسبوك
                                </button>
                                <button class="share-btn twitter" onclick="shareOn('twitter')">
                                    <i class="fab fa-x-twitter"></i> X
                                </button>
                                <button class="share-btn telegram" onclick="shareOn('telegram')">
                                    <i class="fab fa-telegram-plane"></i> تليغرام
                                </button>
                                <button class="share-btn copy" onclick="copyLink()">
                                    <i class="fas fa-link"></i> نسخ الرابط
                                </button>
                            </div>
                        </div>

                        <!-- ====== التعليقات ====== -->
                        <div class="comments-section">
                            <h3>
                                💬 <span>التعليقات</span>
                                <span class="count">${commentsCount}</span>
                            </h3>

                            <!-- نموذج إضافة تعليق -->
                            <div class="comment-form">
                                <div class="form-row">
                                    <input type="text" id="comment-name" placeholder="اسمك (اختياري)">
                                    <input type="text" id="comment-email" placeholder="بريدك (اختياري)">
                                </div>
                                <textarea id="comment-text" placeholder="اكتب تعليقك..."></textarea>
                                <button class="btn-submit" onclick="handleAddComment()">
                                    <i class="fas fa-paper-plane"></i> إرسال التعليق
                                </button>
                            </div>

                            <div id="comments-list">
                `;

                if (comments.length === 0) {
                    html += `<div class="no-comments">لا توجد تعليقات بعد. كن أول من يعلق!</div>`;
                } else {
                    const sorted = [...comments].reverse();
                    sorted.forEach(c => {
                        const cDate = new Date(c.date).toLocaleDateString('ar-EG', {
                            year: 'numeric', month: 'short', day: 'numeric'
                        });
                        html += `
                            <div class="comment">
                                <div>
                                    <span class="comment-author">${c.name || 'زائر'}</span>
                                    <span class="comment-date">${cDate}</span>
                                </div>
                                <div class="comment-text">${c.text}</div>
                            </div>
                        `;
                    });
                }

                html += `
                            </div>
                        </div>
                    </div>
                `;

                container.innerHTML = html;

            } catch (error) {
                console.error('خطأ:', error);
                container.innerHTML = `
                    <div class="status-message">
                        <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>
                        <p>حدث خطأ في تحميل المقال</p>
                        <p class="sub-msg">${error.message}</p>
                        <button class="btn-retry" onclick="loadPost()">
                            <i class="fas fa-sync-alt"></i> إعادة المحاولة
                        </button>
                    </div>
                `;
            }
        }

        // ====== معالج إضافة تعليق ======
        function handleAddComment() {
            if (!currentPostId) {
                showToast('حدث خطأ، يرجى تحديث الصفحة', 'error');
                return;
            }

            const name = document.getElementById('comment-name');
            const text = document.getElementById('comment-text');

            if (!text) return;

            const nameVal = name ? name.value.trim() : '';
            const textVal = text.value.trim();

            if (!textVal) {
                showToast('الرجاء كتابة تعليق', 'error');
                return;
            }

            // إضافة التعليق
            addComment(currentPostId, nameVal || 'زائر', textVal);

            // إعادة تحميل التعليقات فقط
            if (text) text.value = '';
            if (name) name.value = '';

            // تحديث واجهة التعليقات
            refreshComments();

            showToast('✅ تم إضافة تعليقك', 'success');
        }

        // ====== تحديث التعليقات ======
        function refreshComments() {
            if (!currentPostId) return;

            const comments = getComments(currentPostId);
            const list = document.getElementById('comments-list');
            const countEl = document.querySelector('.comments-section .count');

            if (!list) return;

            if (countEl) countEl.textContent = comments.length;

            if (comments.length === 0) {
                list.innerHTML = `<div class="no-comments">لا توجد تعليقات بعد. كن أول من يعلق!</div>`;
                return;
            }

            let html = '';
            const sorted = [...comments].reverse();
            sorted.forEach(c => {
                const cDate = new Date(c.date).toLocaleDateString('ar-EG', {
                    year: 'numeric', month: 'short', day: 'numeric'
                });
                html += `
                    <div class="comment">
                        <div>
                            <span class="comment-author">${c.name || 'زائر'}</span>
                            <span class="comment-date">${cDate}</span>
                        </div>
                        <div class="comment-text">${c.text}</div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        // ====== مشاركة ======
        function shareOn(platform) {
            const url = encodeURIComponent(getCurrentURL());
            const title = encodeURIComponent(getPostTitle());

            const urls = {
                whatsapp: `https://wa.me/?text=${title}%0A%0A${url}`,
                facebook: `https://www.facebook.com/sharer/sharer.php?u=${url}`,
                twitter: `https://x.com/intent/tweet?text=${title}&url=${url}`,
                telegram: `https://t.me/share/url?url=${url}&text=${title}`
            };

            if (urls[platform]) {
                window.open(urls[platform], '_blank', 'width=600,height=500');
            }
        }

        function copyLink() {
            const url = getCurrentURL();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('✅ تم نسخ الرابط', 'success');
                }).catch(() => {
                    fallbackCopyLink(url);
                });
            } else {
                fallbackCopyLink(url);
            }
        }

        function fallbackCopyLink(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ تم نسخ الرابط', 'success');
            } catch {
                showToast('❌ فشل نسخ الرابط، انسخه يدوياً', 'error');
            }
            document.body.removeChild(textarea);
        }

        // ====== جعل الدوال عامة ======
        window.loadPost = loadPost;
        window.handleAddComment = handleAddComment;
        window.shareOn = shareOn;
        window.copyLink = copyLink;

        // ====== التحميل عند فتح الصفحة ======
        document.addEventListener('DOMContentLoaded', function() {
            loadPost();
        });

        console.log('📖 View Post Loaded');
    </script>

</body>

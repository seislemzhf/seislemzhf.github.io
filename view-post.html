<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>عرض المقال | Minsaj DZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ====== CSS كامل ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0a0a;
            color: #f0ece6;
            line-height: 1.8;
            min-height: 100vh;
            transition: 0.3s;
        }
        body.light-mode {
            background: #f5f5f5;
            color: #1a1a1a;
        }
        body.light-mode .bg-card {
            background: #ffffff;
        }
        body.light-mode .border {
            border-color: #e0e0e0;
        }
        body.light-mode .text-muted {
            color: #666;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        :root {
            --accent: #6c8b9e;
            --accent-light: #8aadc2;
            --accent-dark: #4a6a7e;
            --bg-card: #1a1a1a;
            --border: rgba(108, 139, 158, 0.08);
            --text-muted: #6a625a;
            --text-secondary: #b8b0a8;
            --success: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --gold: #F59E0B;
        }

        header {
            padding: 14px 0;
            background: rgba(10, 10, 10, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        body.light-mode header {
            background: rgba(255, 255, 255, 0.96);
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 900;
            color: #f0ece6;
        }
        body.light-mode .logo {
            color: #1a1a1a;
        }
        .logo span {
            color: var(--accent);
        }
        .logo .sub {
            font-size: 0.4rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            display: block;
            font-weight: 400;
        }
        .btn-back {
            display: inline-block;
            background: rgba(108, 139, 158, 0.08);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.75rem;
            border: 1px solid rgba(108, 139, 158, 0.12);
            transition: 0.3s;
        }
        .btn-back:hover {
            background: var(--accent);
            color: #0a0a0a;
            transform: translateY(-2px);
        }
        body.light-mode .btn-back:hover {
            color: #fff;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.3s;
            font-family: inherit;
        }
        .theme-toggle:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        #post-container {
            padding: 20px 0 30px;
        }

        /* ====== المقال ====== */
        .post-full {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 35px 40px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }
        body.light-mode .post-full {
            background: #ffffff;
        }
        .post-full .post-title {
            font-size: 2rem;
            font-weight: 900;
            color: #f0ece6;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        body.light-mode .post-full .post-title {
            color: #1a1a1a;
        }
        .post-full .post-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .post-full .post-meta i {
            color: var(--accent);
            margin: 0 4px;
        }
        .post-full .post-body {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 2;
        }
        body.light-mode .post-full .post-body {
            color: #333;
        }
        .post-full .post-body img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid var(--border);
        }
        .post-full .post-body iframe {
            max-width: 100%;
            border-radius: 10px;
            margin: 20px 0;
        }
        .post-full .post-body h1,
        .post-full .post-body h2,
        .post-full .post-body h3 {
            color: #f0ece6;
            margin: 20px 0 10px;
        }
        body.light-mode .post-full .post-body h1,
        body.light-mode .post-full .post-body h2,
        body.light-mode .post-full .post-body h3 {
            color: #1a1a1a;
        }
        .post-full .post-body ul,
        .post-full .post-body ol {
            padding-right: 25px;
            margin: 10px 0;
        }
        .post-full .post-body blockquote {
            border-right: 3px solid var(--accent);
            padding: 10px 20px;
            margin: 15px 0;
            background: rgba(108, 139, 158, 0.04);
            border-radius: 0 8px 8px 0;
            color: var(--accent-light);
        }

        /* ====== كود مع زر نسخ ====== */
        .code-wrapper {
            position: relative;
            margin: 20px 0;
            background: #0a0a0a;
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            direction: ltr;
            text-align: left;
        }
        body.light-mode .code-wrapper {
            background: #f5f5f5;
            border-color: #e0e0e0;
        }
        .code-wrapper .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            direction: rtl;
        }
        body.light-mode .code-wrapper .code-header {
            background: #e8e8e8;
        }
        .code-wrapper .code-header .lang-tag {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.7rem;
        }
        .code-wrapper .copy-btn {
            background: rgba(108, 139, 158, 0.1);
            border: none;
            color: var(--accent);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .code-wrapper .copy-btn:hover {
            background: var(--accent);
            color: #0a0a0a;
        }
        .code-wrapper .copy-btn.copied {
            background: var(--success);
            color: white;
        }
        .code-wrapper pre {
            margin: 0;
            padding: 16px 20px;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.85rem;
            line-height: 1.7;
            color: #f0ece6;
            background: transparent;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
            word-break: break-word;
        }
        body.light-mode .code-wrapper pre {
            color: #1a1a1a;
        }
        .code-wrapper pre code {
            font-family: inherit;
            background: transparent;
            padding: 0;
        }

        /* ====== الإحصائيات ====== */
        .post-stats {
            display: flex;
            gap: 25px;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .post-stats .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .post-stats .stat-item i {
            color: var(--accent);
        }
        .post-stats .stat-item .num {
            font-weight: 700;
            color: #f0ece6;
        }
        body.light-mode .post-stats .stat-item .num {
            color: #1a1a1a;
        }

        /* ====== تقييم النجوم ====== */
        .rating-section {
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .rating-section .rating-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .stars {
            display: flex;
            gap: 4px;
            direction: ltr;
        }
        .stars .star {
            font-size: 1.8rem;
            cursor: pointer;
            color: #555;
            transition: 0.2s;
            user-select: none;
        }
        .stars .star:hover,
        .stars .star.active {
            color: var(--gold);
        }
        .stars .star.active {
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
        .rating-result {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
        }
        .rating-result .avg {
            color: var(--gold);
            font-weight: 700;
        }

        /* ====== المشاركة ====== */
        .share-section {
            margin: 25px 0 30px;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }
        .share-section .share-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 700;
        }
        .share-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            color: white;
        }
        .share-btn:hover {
            transform: scale(1.05);
        }
        .share-btn.whatsapp {
            background: #25D366;
        }
        .share-btn.facebook {
            background: #1877F2;
        }
        .share-btn.twitter {
            background: #000000;
        }
        .share-btn.telegram {
            background: #0088cc;
        }
        .share-btn.copy {
            background: var(--accent);
            color: #0a0a0a;
        }
        .share-btn.copy:hover {
            background: var(--accent-light);
        }
        .share-btn i {
            font-size: 1rem;
        }

        /* ====== التعليقات ====== */
        .comments-section {
            margin-top: 30px;
        }
        .comments-section h3 {
            font-size: 1.3rem;
            font-weight: 900;
            color: #f0ece6;
            margin-bottom: 18px;
        }
        body.light-mode .comments-section h3 {
            color: #1a1a1a;
        }
        .comments-section h3 span {
            color: var(--accent);
        }
        .comments-section h3 .count {
            background: var(--accent);
            color: #0a0a0a;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            margin-right: 8px;
        }

        .comment-form {
            background: rgba(255, 255, 255, 0.02);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }
        body.light-mode .comment-form {
            background: #f5f5f5;
        }
        .comment-form .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .comment-form input,
        .comment-form textarea {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #f0ece6;
            font-size: 0.9rem;
            font-family: inherit;
            transition: 0.3s;
        }
        body.light-mode .comment-form input,
        body.light-mode .comment-form textarea {
            color: #1a1a1a;
            background: #ffffff;
        }
        .comment-form input:focus,
        .comment-form textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .comment-form textarea {
            min-height: 80px;
            resize: vertical;
        }
        .comment-form .btn-submit {
            background: var(--accent);
            color: #0a0a0a;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            margin-top: 10px;
        }
        .comment-form .btn-submit:hover {
            transform: scale(1.02);
        }
        .comment-form .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .comment {
            background: rgba(255, 255, 255, 0.02);
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }
        body.light-mode .comment {
            background: #f5f5f5;
        }
        .comment .comment-author {
            font-weight: 800;
            color: var(--accent-light);
            font-size: 0.95rem;
        }
        .comment .comment-date {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-right: 10px;
        }
        .comment .comment-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        body.light-mode .comment .comment-text {
            color: #333;
        }

        .no-comments {
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }

        /* ====== مقالات مشابهة ====== */
        .related-posts {
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--border);
        }
        .related-posts h3 {
            font-size: 1.2rem;
            font-weight: 900;
            color: #f0ece6;
            margin-bottom: 15px;
        }
        body.light-mode .related-posts h3 {
            color: #1a1a1a;
        }
        .related-posts h3 i {
            color: var(--accent);
            margin-left: 8px;
        }
        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .related-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }
        body.light-mode .related-item {
            background: #f5f5f5;
        }
        .related-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .related-item .related-title {
            font-weight: 700;
            color: #f0ece6;
            font-size: 0.95rem;
        }
        body.light-mode .related-item .related-title {
            color: #1a1a1a;
        }
        .related-item .related-title:hover {
            color: var(--accent);
        }
        .related-item .related-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        /* ====== جدول المحتويات ====== */
        .toc {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 18px 22px;
            margin: 20px 0;
            border: 1px solid var(--border);
        }
        body.light-mode .toc {
            background: #f5f5f5;
        }
        .toc .toc-title {
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .toc ul {
            list-style: none;
            padding-right: 10px;
        }
        .toc ul li {
            padding: 4px 0;
            font-size: 0.9rem;
        }
        .toc ul li a {
            color: var(--text-secondary);
            transition: 0.3s;
        }
        body.light-mode .toc ul li a {
            color: #444;
        }
        .toc ul li a:hover {
            color: var(--accent);
        }
        .toc ul li .toc-h2 {
            padding-right: 0;
        }
        .toc ul li .toc-h3 {
            padding-right: 20px;
            font-size: 0.85rem;
            opacity: 0.8;
        }
        .toc ul li .toc-h4 {
            padding-right: 40px;
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* ====== حالة التحميل ====== */
        .status-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .status-message i {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 15px;
        }
        .status-message .sub-msg {
            font-size: 0.85rem;
            opacity: 0.6;
            margin-top: 8px;
        }
        .status-message .btn-retry {
            background: var(--accent);
            color: #0a0a0a;
            border: none;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            font-family: inherit;
            transition: 0.3s;
        }
        .status-message .btn-retry:hover {
            transform: scale(1.05);
        }

        /* ====== Toast ====== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 12px;
            color: #f0ece6;
            font-weight: 700;
            z-index: 9999;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            text-align: center;
            font-size: 0.9rem;
        }
        body.light-mode .toast {
            color: #1a1a1a;
            background: #ffffff;
        }
        .toast.show {
            display: block;
            animation: fadeUp 0.3s ease;
        }
        .toast.success {
            border-color: var(--success);
        }
        .toast.error {
            border-color: var(--danger);
        }
        .toast.info {
            border-color: var(--accent);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        footer {
            padding: 25px 0;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            margin-top: 15px;
        }
        footer .ornament {
            font-size: 0.6rem;
            color: var(--accent-dark);
            letter-spacing: 10px;
            opacity: 0.2;
        }
        footer p {
            font-size: 0.75rem;
        }

        @media (max-width: 700px) {
            .post-full {
                padding: 18px 16px;
            }
            .post-full .post-title {
                font-size: 1.5rem;
            }
            .comment-form .form-row {
                grid-template-columns: 1fr;
            }
            .share-buttons {
                justify-content: center;
            }
            .share-btn {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
            .related-grid {
                grid-template-columns: 1fr;
            }
            .code-wrapper .code-header {
                flex-direction: column;
                gap: 5px;
                align-items: stretch;
                text-align: center;
            }
            .code-wrapper pre {
                padding: 12px 14px;
                font-size: 0.75rem;
            }
            .post-stats {
                gap: 12px;
                justify-content: center;
            }
            .stars .star {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="logo">Minsaj <span>DZ</span><span class="sub">✦ مدونة البرمجيات والتقنية ✦</span></div>
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <button class="theme-toggle" onclick="toggleTheme()">
                    <i class="fas fa-moon"></i> <span id="theme-label">وضع داكن</span>
                </button>
                <a href="blog.html" class="btn-back"><i class="fas fa-arrow-right"></i> العودة للمدونة</a>
            </div>
        </div>
    </header>

    <section>
        <div class="container">
            <div id="post-container">
                <div class="status-message">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>جاري تحميل المقال...</p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="ornament">✦ ✦ ✦</div>
            <p>🇩🇿 صنع في الجزائر بـ ❤️</p>
            <p>© 2026 <strong>Minsaj DZ</strong> – جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        // =========================================================
        // 📖 عرض المقالة - النسخة النهائية
        // =========================================================

        const USERNAME = 'seislemzhf';
        const REPO = 'seislemzhf.github.io';
        const PATH = 'data/posts.json';
        const RAW_URL = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/${PATH}`;

        let currentPostId = null;
        let currentPost = null;
        let allPosts = [];

        // ====== دوال مساعدة ======
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            if (!toast) return;
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timer);
            toast._timer = setTimeout(function() { toast.classList.remove('show'); }, 3500);
        }

        function getPostIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        function formatDate(dateStr) {
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch { return dateStr; }
        }

        function stripHtml(html) {
            if (!html) return '';
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        function getCurrentURL() {
            return window.location.href;
        }

        function getPostTitle() {
            return currentPost ? currentPost.title : 'المدونة | Minsaj DZ';
        }

        // ====== الوضع الداكن ======
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const label = document.getElementById('theme-label');
            if (document.body.classList.contains('light-mode')) {
                label.textContent = 'وضع فاتح';
                localStorage.setItem('theme', 'light');
            } else {
                label.textContent = 'وضع داكن';
                localStorage.setItem('theme', 'dark');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light-mode');
                document.getElementById('theme-label').textContent = 'وضع فاتح';
            }
            loadPost();
        });

        // ====== التعليقات ======
        function getComments(postId) {
            const key = 'blog_comments_' + postId;
            try {
                const saved = localStorage.getItem(key);
                return saved ? JSON.parse(saved) : [];
            } catch { return []; }
        }

        function saveComments(postId, comments) {
            const key = 'blog_comments_' + postId;
            localStorage.setItem(key, JSON.stringify(comments));
        }

        function addComment(postId, name, text) {
            const comments = getComments(postId);
            comments.push({
                id: 'c_' + Date.now(),
                name: name || 'زائر',
                text: text.trim(),
                date: new Date().toISOString()
            });
            saveComments(postId, comments);
            return comments;
        }

        // ====== المشاهدات ======
        function incrementViews(postId) {
            const key = 'blog_views_' + postId;
            try {
                let views = parseInt(localStorage.getItem(key) || '0');
                // فقط نزيد المشاهدة مرة واحدة لكل جلسة
                const sessionKey = 'blog_viewed_' + postId;
                if (!localStorage.getItem(sessionKey)) {
                    views++;
                    localStorage.setItem(key, views.toString());
                    localStorage.setItem(sessionKey, 'true');
                }
                return views;
            } catch { return 0; }
        }

        function getViews(postId) {
            const key = 'blog_views_' + postId;
            try {
                return parseInt(localStorage.getItem(key) || '0');
            } catch { return 0; }
        }

        // ====== التقييم ======
        function getRating(postId) {
            const key = 'blog_rating_' + postId;
            try {
                const saved = localStorage.getItem(key);
                if (saved) {
                    const data = JSON.parse(saved);
                    return data;
                }
            } catch (e) {}
            return { total: 0, count: 0, average: 0 };
        }

        function saveRating(postId, rating) {
            const key = 'blog_rating_' + postId;
            localStorage.setItem(key, JSON.stringify(rating));
        }

        function ratePost(postId, stars) {
            const rating = getRating(postId);
            const userKey = 'blog_rated_' + postId;
            if (localStorage.getItem(userKey)) {
                showToast('لقد قيمت هذا المقال مسبقاً!', 'info');
                return rating;
            }

            rating.total += stars;
            rating.count++;
            rating.average = rating.total / rating.count;

            saveRating(postId, rating);
            localStorage.setItem(userKey, 'true');

            return rating;
        }

        // ====== معالج الكود ======
        function processCodeBlocks() {
            const container = document.getElementById('post-container');
            if (!container) return;

            const pres = container.querySelectorAll('pre:has(code)');

            pres.forEach(function(pre) {
                if (pre.closest('.code-wrapper')) return;

                const code = pre.querySelector('code');
                if (!code) return;

                let codeText = code.textContent || '';
                codeText = codeText.trim();

                let lang = 'code';
                if (code.className) {
                    const match = code.className.match(/language-(\w+)/);
                    if (match) { lang = match[1]; }
                }

                const wrapper = document.createElement('div');
                wrapper.className = 'code-wrapper';

                const header = document.createElement('div');
                header.className = 'code-header';

                const langTag = document.createElement('span');
                langTag.className = 'lang-tag';
                langTag.textContent = lang.toUpperCase();

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.innerHTML = '<i class="fas fa-copy"></i> نسخ';
                copyBtn.setAttribute('data-code', codeText);
                copyBtn.onclick = function(e) {
                    e.stopPropagation();
                    copyCode(this);
                };

                header.appendChild(langTag);
                header.appendChild(copyBtn);

                const parent = pre.parentNode;
                const clonePre = pre.cloneNode(true);

                const cloneCode = clonePre.querySelector('code');
                if (cloneCode) { cloneCode.className = ''; }

                wrapper.appendChild(header);
                wrapper.appendChild(clonePre);
                parent.replaceChild(wrapper, pre);
            });
        }

        function copyCode(btn) {
            const code = btn.getAttribute('data-code');
            if (!code) return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(code)
                    .then(function() { showCopyFeedback(btn); })
                    .catch(function() { fallbackCopy(code, btn); });
            } else {
                fallbackCopy(code, btn);
            }
        }

        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showCopyFeedback(btn);
            } catch (e) {
                showToast('❌ فشل نسخ الكود', 'error');
            }
            document.body.removeChild(textarea);
        }

        function showCopyFeedback(btn) {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> تم النسخ!';
            btn.classList.add('copied');
            setTimeout(function() {
                btn.innerHTML = originalText;
                btn.classList.remove('copied');
            }, 2500);
            showToast('✅ تم نسخ الكود', 'success');
        }

        // ====== إنشاء جدول المحتويات ======
        function generateTOC(content) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(content, 'text/html');
            const headings = doc.querySelectorAll('h2, h3, h4');

            if (headings.length < 3) return null;

            let tocHtml =
                `
                <div class="toc">
                    <div class="toc-title"><i class="fas fa-list-ul"></i> محتويات المقال</div>
                    <ul>
            `;

            headings.forEach(function(h) {
                const level = h.tagName.toLowerCase();
                const text = h.textContent.trim();
                if (!text) return;

                // إنشاء معرف فريد
                const id = 'section-' + text.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9\u0600-\u06FF\-]/g, '');
                h.id = id;

                const className = 'toc-' + level;
                tocHtml += `<li><a href="#${id}" class="${className}">${text}</a></li>`;
            });

            tocHtml += `</ul></div>`;

            // إضافة المعرفات إلى العناوين في المحتوى
            const newContent = doc.body.innerHTML;

            return { html: tocHtml, content: newContent };
        }

        // ====== عرض المقال ======
        async function loadPost() {
            const container = document.getElementById('post-container');
            const postId = getPostIdFromURL();

            if (!postId) {
                container.innerHTML =
                    `
                    <div class="status-message">
                        <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>
                        <p>لم يتم تحديد المقال</p>
                        <p class="sub-msg">الرجاء العودة إلى المدونة واختيار مقال.</p>
                        <a href="blog.html" class="btn-retry"><i class="fas fa-arrow-right"></i> العودة للمدونة</a>
                    </div>
                `;
                return;
            }

            currentPostId = postId;

            try {
                const response = await fetch(RAW_URL + '?t=' + Date.now());

                if (response.status === 404) {
                    container.innerHTML =
                        `
                        <div class="status-message">
                            <i class="fas fa-newspaper" style="color:var(--accent);"></i>
                            <p>لا توجد مقالات حالياً.</p>
                            <p class="sub-msg">ترقبوا المقالات القادمة!</p>
                            <a href="blog.html" class="btn-retry"><i class="fas fa-arrow-right"></i> العودة للمدونة</a>
                        </div>
                    `;
                    return;
                }

                if (!response.ok) throw new Error('فشل في تحميل المقال');

                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('بيانات غير صالحة');

                allPosts = data;
                const post = data.find(function(p) { return p.id === postId; });

                if (!post) {
                    container.innerHTML =
                        `
                        <div class="status-message">
                            <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>
                            <p>المقال غير موجود</p>
                            <p class="sub-msg">قد يكون تم حذفه أو لم ينشر بعد.</p>
                            <a href="blog.html" class="btn-retry"><i class="fas fa-arrow-right"></i> العودة للمدونة</a>
                        </div>
                    `;
                    return;
                }

                currentPost = post;

                // زيادة المشاهدات
                incrementViews(postId);

                // ====== التعليقات ======
                const comments = getComments(postId);
                const commentsCount = comments.length;

                // ====== التقييم ======
                const rating = getRating(postId);
                const avgRating = rating.average || 0;
                const ratingCount = rating.count || 0;

                // ====== المشاهدات ======
                const views = getViews(postId);

                // ====== عرض المحتوى ======
                const date = formatDate(post.date);
                const tags = post.tags || 'عام';
                let content = post.content || 'لا يوجد محتوى.';
                const title = post.title || 'بدون عنوان';

                // ====== إنشاء جدول المحتويات ======
                const tocData = generateTOC(content);
                if (tocData) {
                    content = tocData.content;
                }

                // ====== وقت القراءة ======
                const plainText = stripHtml(content);
                const wordCount = plainText.split(/\s+/).length;
                const readingTime = Math.max(1, Math.round(wordCount / 200));

                // ====== المقالات المشابهة ======
                let relatedHtml = '';
                const related = data
                    .filter(function(p) { return p.id !== postId && p.published !== false && p.status !== 'draft' &&
                            !p.deleted; })
                    .sort(function(a, b) {
                        const aTags = (a.tags || '').split(',').map(function(t) { return t.trim(); });
                        const bTags = (b.tags || '').split(',').map(function(t) { return t.trim(); });
                        const currentTags = (tags || '').split(',').map(function(t) { return t.trim(); });
                        const aScore = aTags.filter(function(t) { return currentTags.includes(t); }).length;
                        const bScore = bTags.filter(function(t) { return currentTags.includes(t); }).length;
                        return bScore - aScore;
                    })
                    .slice(0, 4);

                if (related.length > 0) {
                    relatedHtml =
                        `
                        <div class="related-posts">
                            <h3><i class="fas fa-link"></i> مقالات مشابهة</h3>
                            <div class="related-grid">
                    `;
                    related.forEach(function(r) {
                        const rDate = new Date(r.date).toLocaleDateString('ar-EG', {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric'
                        });
                        relatedHtml +=
                            `
                            <a href="view-post.html?id=${r.id}" class="related-item">
                                <div class="related-title">${r.title || 'بدون عنوان'}</div>
                                <div class="related-meta"><i class="fas fa-calendar"></i> ${rDate}</div>
                            </a>
                        `;
                    });
                    relatedHtml += `</div></div>`;
                }

                // ====== بناء HTML كامل ======
                let html = `
                    <div class="post-full">

                        <!-- صورة مميزة -->
                        ${post.image ? `<img src="${post.image}" alt="${title}" style="width:100%; max-height:400px; object-fit:cover; border-radius:12px; margin-bottom:20px;" onerror="this.style.display='none'">` : ''}

                        <h1 class="post-title">${title}</h1>

                        <div class="post-meta">
                            <i class="fas fa-calendar"></i> ${date}
                            <span style="margin:0 10px;">|</span>
                            <i class="fas fa-tag"></i> ${tags}
                            <span style="margin:0 10px;">|</span>
                            <i class="fas fa-clock"></i> ${readingTime} دقيقة قراءة
                        </div>

                        <!-- ====== الإحصائيات ====== -->
                        <div class="post-stats">
                            <div class="stat-item">
                                <i class="fas fa-eye"></i>
                                <span class="num">${views}</span> مشاهدة
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-comment"></i>
                                <span class="num">${commentsCount}</span> تعليق
                            </div>
                            <div class="stat-item">
                                <i class="fas fa-star" style="color:var(--gold);"></i>
                                <span class="num">${avgRating.toFixed(1)}</span> (${ratingCount} تقييم)
                            </div>
                        </div>

                        <!-- ====== التقييم ====== -->
                        <div class="rating-section">
                            <div class="rating-label"><i class="fas fa-star" style="color:var(--gold);"></i> قيم هذا المقال:</div>
                            <div class="stars" id="stars-container">
                                <span class="star" data-value="1">★</span>
                                <span class="star" data-value="2">★</span>
                                <span class="star" data-value="3">★</span>
                                <span class="star" data-value="4">★</span>
                                <span class="star" data-value="5">★</span>
                            </div>
                            <div class="rating-result" id="rating-result">
                                <span class="avg">${avgRating.toFixed(1)}</span> / 5 (${ratingCount} تقييم)
                            </div>
                        </div>

                        <!-- ====== جدول المحتويات ====== -->
                        ${tocData ? tocData.html : ''}

                        <!-- ====== المحتوى ====== -->
                        <div class="post-body">
                            ${content}
                        </div>

                        <!-- ====== المشاركة ====== -->
                        <div class="share-section">
                            <div class="share-label"><i class="fas fa-share-alt"></i> شارك هذا المقال:</div>
                            <div class="share-buttons">
                                <button class="share-btn whatsapp" onclick="shareOn('whatsapp')"><i class="fab fa-whatsapp"></i> واتساب</button>
                                <button class="share-btn facebook" onclick="shareOn('facebook')"><i class="fab fa-facebook-f"></i> فيسبوك</button>
                                <button class="share-btn twitter" onclick="shareOn('twitter')"><i class="fab fa-x-twitter"></i> X</button>
                                <button class="share-btn telegram" onclick="shareOn('telegram')"><i class="fab fa-telegram-plane"></i> تليغرام</button>
                                <button class="share-btn copy" onclick="copyLink()"><i class="fas fa-link"></i> نسخ الرابط</button>
                            </div>
                        </div>

                        <!-- ====== التعليقات ====== -->
                        <div class="comments-section">
                            <h3>💬 <span>التعليقات</span> <span class="count">${commentsCount}</span></h3>
                            <div class="comment-form">
                                <div class="form-row">
                                    <input type="text" id="comment-name" placeholder="اسمك (اختياري)">
                                    <input type="text" id="comment-email" placeholder="بريدك (اختياري)">
                                </div>
                                <textarea id="comment-text" placeholder="اكتب تعليقك..."></textarea>
                                <button class="btn-submit" onclick="handleAddComment()"><i class="fas fa-paper-plane"></i> إرسال التعليق</button>
                            </div>
                            <div id="comments-list">
                `;

                if (comments.length === 0) {
                    html += `<div class="no-comments">لا توجد تعليقات بعد. كن أول من يعلق!</div>`;
                } else {
                    const sorted = [...comments].reverse();
                    sorted.forEach(function(c) {
                        const cDate = new Date(c.date).toLocaleDateString('ar-EG', {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric'
                        });
                        html += `
                            <div class="comment">
                                <div>
                                    <span class="comment-author">${c.name || 'زائر'}</span>
                                    <span class="comment-date">${cDate}</span>
                                </div>
                                <div class="comment-text">${c.text}</div>
                            </div>
                        `;
                    });
                }

                html += `
                            </div>
                        </div>
                        ${relatedHtml}
                    </div>
                `;

                container.innerHTML = html;

                // معالجة الكود
                setTimeout(function() {
                    processCodeBlocks();
                }, 200);

                // إعداد التقييم
                setupRating(postId);

                // إضافة المستمع للتعليقات
                setupCommentsListener();

            } catch (error) {
                console.error('خطأ:', error);
                container.innerHTML =
                    `
                    <div class="status-message">
                        <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>
                        <p>حدث خطأ في تحميل المقال</p>
                        <p class="sub-msg">${error.message}</p>
                        <button class="btn-retry" onclick="loadPost()"><i class="fas fa-sync-alt"></i> إعادة المحاولة</button>
                    </div>
                `;
            }
        }

        // ====== إعداد التقييم ======
        function setupRating(postId) {
            const stars = document.querySelectorAll('.star');
            const ratingResult = document.getElementById('rating-result');

            if (!stars.length) return;

            // تعيين التقييم الحالي إذا كان المستخدم قد قيم سابقاً
            const userRated = localStorage.getItem('blog_rated_' + postId);
            if (userRated) {
                const rating = getRating(postId);
                // عرض التقييم لكن لا نسمح بالتغيير
                stars.forEach(function(star) {
                    star.style.cursor = 'default';
                    const value = parseInt(star.getAttribute('data-value'));
                    if (value <= Math.round(rating.average)) {
                        star.classList.add('active');
                    }
                });
                return;
            }

            stars.forEach(function(star) {
                star.addEventListener('mouseenter', function() {
                    const value = parseInt(this.getAttribute('data-value'));
                    stars.forEach(function(s) {
                        const v = parseInt(s.getAttribute('data-value'));
                        if (v <= value) {
                            s.classList.add('active');
                        } else {
                            s.classList.remove('active');
                        }
                    });
                });

                star.addEventListener('mouseleave', function() {
                    stars.forEach(function(s) {
                        s.classList.remove('active');
                    });
                });

                star.addEventListener('click', function() {
                    const value = parseInt(this.getAttribute('data-value'));
                    const rating = ratePost(postId, value);

                    // تحديث التقييم
                    if (ratingResult) {
                        ratingResult.innerHTML =
                            `<span class="avg">${rating.average.toFixed(1)}</span> / 5 (${rating.count} تقييم)`;
                    }

                    // تعطيل النجوم
                    stars.forEach(function(s) {
                        s.style.cursor = 'default';
                        const v = parseInt(s.getAttribute('data-value'));
                        if (v <= value) {
                            s.classList.add('active');
                        }
                    });

                    showToast('⭐ شكراً لتقييمك!', 'success');
                });
            });
        }

        // ====== التعليقات ======
        function handleAddComment() {
            if (!currentPostId) {
                showToast('حدث خطأ، يرجى تحديث الصفحة', 'error');
                return;
            }

            const name = document.getElementById('comment-name');
            const text = document.getElementById('comment-text');
            if (!text) return;

            const nameVal = name ? name.value.trim() : '';
            const textVal = text.value.trim();
            if (!textVal) {
                showToast('الرجاء كتابة تعليق', 'error');
                return;
            }

            addComment(currentPostId, nameVal || 'زائر', textVal);
            if (text) text.value = '';
            if (name) name.value = '';
            refreshComments();
            showToast('✅ تم إضافة تعليقك', 'success');
        }

        function refreshComments() {
            if (!currentPostId) return;
            const comments = getComments(currentPostId);
            const list = document.getElementById('comments-list');
            const countEl = document.querySelector('.comments-section .count');
            if (!list) return;
            if (countEl) countEl.textContent = comments.length;

            if (comments.length === 0) {
                list.innerHTML = `<div class="no-comments">لا توجد تعليقات بعد. كن أول من يعلق!</div>`;
                return;
            }

            let html = '';
            const sorted = [...comments].reverse();
            sorted.forEach(function(c) {
                const cDate = new Date(c.date).toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
                html += `
                    <div class="comment">
                        <div>
                            <span class="comment-author">${c.name || 'زائر'}</span>
                            <span class="comment-date">${cDate}</span>
                        </div>
                        <div class="comment-text">${c.text}</div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        // ====== مستمع للتعليقات ======
        function setupCommentsListener() {
            // إضافة زر إرسال بالضغط على Enter في حقل التعليق
            const textarea = document.getElementById('comment-text');
            if (textarea) {
                textarea.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' && e.shiftKey) {
                        // Shift+Enter = سطر جديد
                        return;
                    } else if (e.key === 'Enter') {
                        e.preventDefault();
                        handleAddComment();
                    }
                });
            }
        }

        // ====== المشاركة ======
        function shareOn(platform) {
            const url = encodeURIComponent(getCurrentURL());
            const title = encodeURIComponent(getPostTitle());
            const urls = {
                whatsapp: `https://wa.me/?text=${title}%0A%0A${url}`,
                facebook: `https://www.facebook.com/sharer/sharer.php?u=${url}`,
                twitter: `https://x.com/intent/tweet?text=${title}&url=${url}`,
                telegram: `https://t.me/share/url?url=${url}&text=${title}`
            };
            if (urls[platform]) {
                window.open(urls[platform], '_blank', 'width=600,height=500');
            }
        }

        function copyLink() {
            const url = getCurrentURL();
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url)
                    .then(function() { showToast('✅ تم نسخ الرابط', 'success'); })
                    .catch(function() { fallbackCopyLink(url); });
            } else {
                fallbackCopyLink(url);
            }
        }

        function fallbackCopyLink(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast('✅ تم نسخ الرابط', 'success');
            } catch {
                showToast('❌ فشل نسخ الرابط، انسخه يدوياً', 'error');
            }
            document.body.removeChild(textarea);
        }

        // ====== دوال عامة ======

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المقال | Minsaj DZ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: #0a0a0a;
            color: #f0ece6;
            line-height: 1.8;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }
        a { text-decoration: none; color: inherit; }

        :root {
            --accent: #6c8b9e;
            --accent-light: #8aadc2;
            --accent-dark: #4a6a7e;
            --bg-card: #1a1a1a;
            --border: rgba(108, 139, 158, 0.08);
            --text-muted: #6a625a;
            --text-secondary: #b8b0a8;
        }

        /* ====== Header ====== */
        header {
            padding: 20px 0;
            background: rgba(10, 10, 10, 0.96);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 900;
            color: #f0ece6;
        }
        .logo span { color: var(--accent); }
        .logo .sub {
            font-size: 0.5rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            display: block;
            font-weight: 400;
        }
        .btn-back {
            display: inline-block;
            background: rgba(108, 139, 158, 0.08);
            color: var(--accent);
            padding: 8px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(108, 139, 158, 0.12);
            transition: 0.3s;
        }
        .btn-back:hover {
            background: var(--accent);
            color: #0a0a0a;
            transform: translateY(-2px);
        }

        /* ====== المقال ====== */
        .post-full {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 40px 45px;
            margin: 30px 0;
            border: 1px solid var(--border);
        }
        .post-full .post-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f0ece6;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .post-full .post-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .post-full .post-meta i { color: var(--accent); margin: 0 4px; }
        .post-full .post-body {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 2;
        }
        .post-full .post-body img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin: 20px 0;
            border: 1px solid var(--border);
        }
        .post-full .post-body iframe {
            max-width: 100%;
            border-radius: 10px;
            margin: 20px 0;
        }
        .post-full .post-body h1, .post-full .post-body h2, .post-full .post-body h3 {
            color: #f0ece6;
            margin: 20px 0 10px;
        }
        .post-full .post-body ul, .post-full .post-body ol {
            padding-right: 25px;
            margin: 10px 0;
        }
        .post-full .post-body blockquote {
            border-right: 3px solid var(--accent);
            padding: 10px 20px;
            margin: 15px 0;
            background: rgba(108, 139, 158, 0.04);
            border-radius: 0 8px 8px 0;
            color: var(--accent-light);
        }
        .post-full .post-body pre {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow-x: auto;
            direction: ltr;
            text-align: left;
            font-family: monospace;
            color: #f0ece6;
            margin: 15px 0;
        }

        /* ====== إعجابات ====== */
        .post-actions {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 20px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin: 20px 0 30px;
            flex-wrap: wrap;
        }
        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(108, 139, 158, 0.08);
            color: var(--accent);
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            border: 1px solid rgba(108, 139, 158, 0.12);
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .like-btn:hover {
            background: var(--accent);
            color: #0a0a0a;
        }
        .like-btn.liked {
            background: var(--accent);
            color: #0a0a0a;
        }
        .like-btn i { font-size: 1.1rem; }
        .like-count {
            color: var(--text-muted);
            font-weight: 700;
        }

        /* ====== التعليقات ====== */
        .comments-section {
            margin-top: 30px;
        }
        .comments-section h3 {
            font-size: 1.4rem;
            font-weight: 900;
            color: #f0ece6;
            margin-bottom: 20px;
        }
        .comments-section h3 span { color: var(--accent); }

        .comment-form {
            background: rgba(255,255,255,0.02);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }
        .comment-form input,
        .comment-form textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #f0ece6;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.3s;
            margin-bottom: 12px;
        }
        .comment-form input:focus,
        .comment-form textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
        .comment-form textarea {
            min-height: 80px;
            resize: vertical;
        }
        .comment-form .btn-submit {
            background: var(--accent);
            color: #0a0a0a;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .comment-form .btn-submit:hover {
            transform: scale(1.02);
        }

        .comment {
            background: rgba(255,255,255,0.02);
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
        }
        .comment .comment-author {
            font-weight: 800;
            color: var(--accent-light);
            font-size: 0.95rem;
        }
        .comment .comment-date {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-right: 10px;
        }
        .comment .comment-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .comment .comment-actions {
            margin-top: 8px;
            display: flex;
            gap: 15px;
        }
        .comment .comment-actions button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .comment .comment-actions button:hover {
            color: var(--accent);
        }
        .comment .comment-actions .delete-comment {
            color: #EF4444;
        }
        .comment .comment-actions .delete-comment:hover {
            color: #f87171;
        }

        .no-comments {
            color: var(--text-muted);
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
        }

        /* ====== Toast ====== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 15px 30px;
            border-radius: 12px;
            color: #f0ece6;
            font-weight: 700;
            z-index: 9999;
            display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .toast.show {
            display: block;
            animation: fadeUp 0.3s ease;
        }
        .toast.success { border-color: #10B981; }
        .toast.error { border-color: #EF4444; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .status-message {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .status-message i { font-size: 2.5rem; color: var(--accent); margin-bottom: 15px; }

        @media (max-width: 700px) {
            .post-full { padding: 20px; }
            .post-full .post-title { font-size: 1.6rem; }
            .post-actions { justify-content: center; }
            .comment-form { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- ====== Header ====== -->
    <header>
        <div class="container header-content">
            <div class="logo">
                Minsaj <span>DZ</span>
                <span class="sub">✦ مدونة البرمجيات والتقنية ✦</span>
            </div>
            <a href="blog.html" class="btn-back">
                <i class="fas fa-arrow-right"></i> العودة للمدونة
            </a>
        </div>
    </header>

    <!-- ====== محتوى المقال ====== -->
    <section>
        <div class="container">
            <div id="post-container">
                <div class="status-message">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>جاري تحميل المقال...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- ====== Toast ====== -->
    <div class="toast" id="toast"></div>

    <script>
        // =========================================================
        // 📝 عرض المقالة كاملة مع تعليقات وإعجابات
        // =========================================================

        const STORAGE_KEY = 'blog_posts';
        const COMMENTS_KEY = 'blog_comments';
        const LIKES_KEY = 'blog_likes';
        let currentPostId = null;

        // ====== الحصول على معرّف المقال من الرابط ======
        function getPostIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // ====== Toast ======
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ====== التعليقات ======
        function getComments(postId) {
            const saved = localStorage.getItem(COMMENTS_KEY);
            if (saved) {
                try {
                    const all = JSON.parse(saved);
                    return all[postId] || [];
                } catch { return []; }
            }
            return [];
        }

        function saveComments(postId, comments) {
            const saved = localStorage.getItem(COMMENTS_KEY);
            let all = {};
            try { all = JSON.parse(saved) || {}; } catch { all = {}; }
            all[postId] = comments;
            localStorage.setItem(COMMENTS_KEY, JSON.stringify(all));
        }

        function addComment(postId, name, text) {
            const comments = getComments(postId);
            comments.push({
                id: 'c_' + Date.now(),
                name: name || 'زائر',
                text: text,
                date: new Date().toISOString()
            });
            saveComments(postId, comments);
            return comments;
        }

        function deleteComment(postId, commentId) {
            let comments = getComments(postId);
            comments = comments.filter(c => c.id !== commentId);
            saveComments(postId, comments);
            return comments;
        }

        // ====== الإعجابات ======
        function getLikes(postId) {
            const saved = localStorage.getItem(LIKES_KEY);
            if (saved) {
                try {
                    const all = JSON.parse(saved);
                    return all[postId] || 0;
                } catch { return 0; }
            }
            return 0;
        }

        function setLikes(postId, count) {
            const saved = localStorage.getItem(LIKES_KEY);
            let all = {};
            try { all = JSON.parse(saved) || {}; } catch { all = {}; }
            all[postId] = count;
            localStorage.setItem(LIKES_KEY, JSON.stringify(all));
        }

        function hasUserLiked(postId) {
            const key = 'liked_' + postId;
            return localStorage.getItem(key) === 'true';
        }

        function toggleLike(postId) {
            let likes = getLikes(postId);
            const userLiked = hasUserLiked(postId);

            if (userLiked) {
                likes = Math.max(0, likes - 1);
                localStorage.removeItem('liked_' + postId);
            } else {
                likes = likes + 1;
                localStorage.setItem('liked_' + postId, 'true');
            }

            setLikes(postId, likes);
            return likes;
        }

        // ====== عرض المقال ======
        function renderPost(postId) {
            const container = document.getElementById('post-container');

            // جلب المقالات
            const saved = localStorage.getItem(STORAGE_KEY);
            let posts = [];
            try { posts = JSON.parse(saved) || []; } catch { posts = []; }

            const post = posts.find(p => p.id === postId);

            if (!post) {
                container.innerHTML = `
                    <div class="status-message">
                        <i class="fas fa-exclamation-circle" style="color:#EF4444;"></i>
                        <p>المقال غير موجود</p>
                        <p style="font-size:0.85rem; opacity:0.6;">قد يكون تم حذفه أو لم ينشر بعد.</p>
                    </div>
                `;
                return;
            }

            currentPostId = postId;

            // جلب التعليقات والإعجابات
            const comments = getComments(postId);
            let likes = getLikes(postId);
            const userLiked = hasUserLiked(postId);

            const date = new Date(post.date).toLocaleDateString('ar-EG', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // عرض المقال
            let html = `
                <div class="post-full">
                    <h1 class="post-title">${post.title}</h1>
                    <div class="post-meta">
                        <i class="fas fa-calendar"></i> ${date}
                        <span style="margin:0 10px;">|</span>
                        <i class="fas fa-tag"></i> ${post.tags || 'عام'}
                    </div>
                    <div class="post-body">
                        ${post.content || 'لا يوجد محتوى.'}
                    </div>

                    <!-- الإعجابات -->
                    <div class="post-actions">
                        <button class="like-btn ${userLiked ? 'liked' : ''}" onclick="handleLike()">
                            <i class="fas fa-heart"></i>
                            <span id="like-count">${likes}</span>
                        </button>
                        <span class="like-count"><i class="fas fa-comment"></i> ${comments.length} تعليق</span>
                    </div>

                    <!-- التعليقات -->
                    <div class="comments-section">
                        <h3>💬 <span>التعليقات</span> (${comments.length})</h3>

                        <!-- نموذج إضافة تعليق -->
                        <div class="comment-form">
                            <input type="text" id="comment-name" placeholder="اسمك (اختياري)">
                            <textarea id="comment-text" placeholder="اكتب تعليقك..."></textarea>
                            <button class="btn-submit" onclick="handleAddComment()">
                                <i class="fas fa-paper-plane"></i> إرسال التعليق
                            </button>
                        </div>

                        <div id="comments-list">
            `;

            if (comments.length === 0) {
                html += `<div class="no-comments">لا توجد تعليقات بعد. كن أول من يعلق!</div>`;
            } else {
                // عرض التعليقات من الأحدث إلى الأقدم
                const sortedComments = [...comments].reverse();
                sortedComments.forEach(c => {
                    const cDate = new Date(c.date).toLocaleDateString('ar-EG', {
                        year: 'numeric',
                        month: 'short',
                        day: 'numeric'
                    });
                    html += `
                        <div class="comment" data-id="${c.id}">
                            <div>
                                <span class="comment-author">${c.name || 'زائر'}</span>
                                <span class="comment-date">${cDate}</span>
                            </div>
                            <div class="comment-text">${c.text}</div>
                            <div class="comment-actions">
                                <button class="delete-comment" onclick="handleDeleteComment('${c.id}')">
                                    <i class="fas fa-trash"></i> حذف
                                </button>
                            </div>
                        </div>
                    `;
                });
            }

            html += `
                        </div>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        // ====== معالج الإعجاب ======
        function handleLike() {
            if (!currentPostId) return;
            const newLikes = toggleLike(currentPostId);
            const countEl = document.getElementById('like-count');
            if (countEl) countEl.textContent = newLikes;
            // تحديث شكل الزر
            const btn = document.querySelector('.like-btn');
            if (btn) {
                btn.classList.toggle('liked');
            }
        }

        // ====== معالج إضافة تعليق ======
        function handleAddComment() {
            if (!currentPostId) return;
            const name = document.getElementById('comment-name').value.trim() || 'زائر';
            const text = document.getElementById('comment-text').value.trim();

            if (!text) {
                showToast('الرجاء كتابة تعليق', 'error');
                return;
            }

            addComment(currentPostId, name, text);
            document.getElementById('comment-text').value = '';
            renderPost(currentPostId);
            showToast('✅ تم إضافة تعليقك', 'success');
        }

        // ====== معالج حذف تعليق ======
        function handleDeleteComment(commentId) {
            if (!currentPostId) return;
            if (!confirm('هل أنت متأكد من حذف هذا التعليق؟')) return;
            deleteComment(currentPostId, commentId);
            renderPost(currentPostId);
            showToast('🗑️ تم حذف التعليق', 'success');
        }

        // ====== تحميل المقال ======
        function loadPost() {
            const postId = getPostIdFromURL();
            if (!postId) {
                document.getElementById('post-container').innerHTML = `
                    <div class="status-message">
                        <i class="fas fa-exclamation-circle" style="color:#EF4444;"></i>
                        <p>لم يتم تحديد المقال</p>
                        <p style="font-size:0.85rem; opacity:0.6;">الرجاء العودة إلى المدونة واختيار مقال.</p>
                    </div>
                `;
                return;
            }
            renderPost(postId);
        }

        // ====== تشغيل ======
        document.addEventListener('DOMContentLoaded', loadPost);

        // ====== جعل الدوال عامة للاستخدام في HTML ======
        window.handleLike = handleLike;
        window.handleAddComment = handleAddComment;
        window.handleDeleteComment = handleDeleteComment;
    </script>

</body>
</html>
